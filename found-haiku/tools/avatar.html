<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; flex-wrap: wrap; background: #888; }
  .v { width: 500px; height: 500px; position: relative; }
  svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!-- A: sky ground, cream 5-7-5 -->
<div class="v" id="A"><svg viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#1a82c4"/>
  <g fill="#faf9f6">
    <rect x="230" y="352" width="340" height="84" rx="42"/>
    <rect x="230" y="458" width="476" height="84" rx="42"/>
    <rect x="230" y="564" width="340" height="84" rx="42"/>
  </g>
</svg></div>

<!-- B: the found-poem card: cream, green edge, ink bars -->
<div class="v" id="B"><svg viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#faf9f6"/>
  <rect x="150" y="300" width="26" height="400" rx="13" fill="#2e7d4f"/>
  <g fill="#1a1a1a">
    <rect x="240" y="352" width="330" height="84" rx="42"/>
    <rect x="240" y="458" width="462" height="84" rx="42"/>
    <rect x="240" y="564" width="330" height="84" rx="42"/>
  </g>
</svg></div>

<!-- C: cream ground, sky bars (the favicon, grown up) -->
<div class="v" id="C"><svg viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#faf9f6"/>
  <g fill="#1a82c4">
    <rect x="230" y="352" width="340" height="84" rx="42"/>
    <rect x="230" y="458" width="476" height="84" rx="42"/>
    <rect x="230" y="564" width="340" height="84" rx="42"/>
  </g>
</svg></div>

<!-- D: night mode, gold bars — the shiny -->
<div class="v" id="D"><svg viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#0f0f0f"/>
  <g fill="#d8b85a">
    <rect x="230" y="352" width="340" height="84" rx="42"/>
    <rect x="230" y="458" width="476" height="84" rx="42"/>
    <rect x="230" y="564" width="340" height="84" rx="42"/>
  </g>
</svg></div>

<!-- E: sky ground, cream bars, one found word in gold -->
<div class="v" id="E"><svg viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#1a82c4"/>
  <g fill="#faf9f6">
    <rect x="230" y="352" width="340" height="84" rx="42"/>
    <rect x="230" y="458" width="270" height="84" rx="42"/>
    <rect x="230" y="564" width="340" height="84" rx="42"/>
  </g>
  <rect x="530" y="458" width="176" height="84" rx="42" fill="#d8b85a"/>
</svg></div>
</body>
</html>
