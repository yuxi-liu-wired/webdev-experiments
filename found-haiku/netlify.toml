# Set the Netlify site's base directory to "found-haiku"; this file and the
# publish path below are then read relative to it.
[build]
  publish = "public"

# No build step: public/ is plain HTML, ES modules and a text data file.
# Netlify compresses text assets itself, which is the only job serve.mjs does
# that the deployed site still needs.

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/src/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# The bot: a scheduled function polling for mentions (netlify/functions/).
# It needs the syllable table shipped alongside the bundled code, and the
# BOT_* environment variables set in the site settings before it can speak.
[functions]
  directory = "netlify/functions"
  included_files = ["public/data/syllables.txt"]
