name: refresh feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bsky-url-feed
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test scripts/

      - name: Ingest + classify
        run: bun run scripts/ingest.ts

      - name: Commit refreshed feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add public/xrpc/app.bsky.feed.getFeedSkeleton state/seen.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "refresh $(date -u +%FT%TZ)"
            git push
          fi
